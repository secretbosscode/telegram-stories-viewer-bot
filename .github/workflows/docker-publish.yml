
name: Publish Docker image

on:
  push:
    branches:
      - main
      - development
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: telegram-story-bot-docker
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: [self-hosted, linux, x64]

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # TrueNAS runner checkout permissions may differ from GitHub-hosted
      # runners. Normalize before BuildKit reads the build context.
      - name: Fix and verify Docker entrypoint permissions
        shell: bash
        run: |
          set -euo pipefail

          for script in entrypoint.sh healthcheck.sh; do
            if [ ! -f "$script" ]; then
              echo "::error::Missing required script: $script"
              exit 1
            fi

            chmod 0755 "$script"

            mode=$(stat -c '%a' "$script")
            echo "$script permissions: $mode"

            if [ "$mode" != "755" ]; then
              echo "::error::$script must have permissions 755"
              exit 1
            fi
          done

          echo "Both scripts are readable and executable by UID 568."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Verify TrueNAS builder
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner: $RUNNER_NAME"
          echo "Repository: $GITHUB_REPOSITORY"

          docker info --format 'Docker: {{.ServerVersion}}'
          docker buildx version
          nproc

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version and target tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            SECONDARY_TAG="latest"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            VERSION="${BRANCH_NAME}-$(git rev-parse --short HEAD)"

            if [[ "$BRANCH_NAME" == "main" ]]; then
              SECONDARY_TAG="latest"
            elif [[ "$BRANCH_NAME" == "development" ]]; then
              SECONDARY_TAG="dev"
            else
              echo "::error::Unsupported branch: $BRANCH_NAME"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "secondary_tag=$SECONDARY_TAG" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "Secondary tag: $SECONDARY_TAG"

      - name: Build and push with local SSD cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64

          tags: |
            telix5000/telegram-story-bot:${{ steps.vars.outputs.version }}
            telix5000/telegram-story-bot:${{ steps.vars.outputs.secondary_tag }}

          cache-from: type=local,src=/mnt/ssd/docker/github-action/cache/telegram-story-bot
          cache-to: type=local,dest=/mnt/ssd/docker/github-action/cache/telegram-story-bot,mode=max,reset=true

          provenance: true
          sbom: true
