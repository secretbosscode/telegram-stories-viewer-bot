
name: Publish Docker image

on:
  push:
    branches:
      - main
      - development
    tags:
      - 'v*'
  workflow_dispatch:

# Prevent two builds from writing the same local cache
concurrency:
  group: telegram-story-bot-docker
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: [self-hosted, linux, x64]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Verify TrueNAS builder
        run: |
          echo "Runner: $RUNNER_NAME"
          docker info --format 'Docker: {{.ServerVersion}}'
          docker buildx version
          nproc

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version and target tag
        id: vars
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            SECONDARY_TAG="latest"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            VERSION="${BRANCH_NAME}-$(git rev-parse --short HEAD)"

            if [[ "$BRANCH_NAME" == "main" ]]; then
              SECONDARY_TAG="latest"
            elif [[ "$BRANCH_NAME" == "development" ]]; then
              SECONDARY_TAG="dev"
            else
              SECONDARY_TAG=""
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "secondary_tag=$SECONDARY_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push with local SSD cache
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            telix5000/telegram-story-bot:${{ steps.vars.outputs.version }}
            telix5000/telegram-story-bot:${{ steps.vars.outputs.secondary_tag }}

          cache-from: type=local,src=/mnt/ssd/docker/github-action/cache/telegram-story-bot
          cache-to: type=local,dest=/mnt/ssd/docker/github-action/cache/telegram-story-bot,mode=max,reset=true

          provenance: true
          sbom: true
